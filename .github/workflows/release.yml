name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.9). Required when not running from a tag push."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    # Off by default. A tag push does nothing until the repo owner sets the repository
    # variable GECKO_RELEASE_ENABLED to "true". Forks and the public mirror never set it,
    # so a v* tag (also the tag that `gh release create` makes) cannot build, upload or publish.
    if: vars.GECKO_RELEASE_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the release notes can list the commits since the last tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          }
          else {
            throw "Set a tag ref (push v*) or pass workflow_dispatch input tag (for example v1.0.9)."
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Refusing tag '$tag'. Expected vMAJOR.MINOR.PATCH."
          }
          if ($tag -match '^v1\.0\.[0-9]$') {
            throw "Refusing to overwrite release $tag."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Materialize application icon
        shell: pwsh
        run: |
          $b64 = "GeckoPeeks/Assets/gecko-peeks.ico.b64"
          $ico = "GeckoPeeks/Assets/gecko-peeks.ico"
          if (-not (Test-Path -LiteralPath $b64)) { throw "Missing $b64" }
          if (-not (Test-Path -LiteralPath $ico)) {
            certutil -decode $b64 $ico
          }
          if (-not (Test-Path -LiteralPath $ico)) { throw "Icon decode failed" }
          (Get-Item -LiteralPath $ico).Length

      - name: Test
        shell: pwsh
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        working-directory: GeckoPeeks
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Smoke-run GeckoPeeks.exe
        shell: pwsh
        run: ./.github/scripts/smoke-exe.ps1 -Exe "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe" -ExpectVersion "${{ steps.tag.outputs.version }}" -OutDir smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ steps.tag.outputs.tag }}
          path: smoke
          if-no-files-found: warn

      - name: Write SHA-256 file
        id: hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published exe was not found at $exe"
          }

          # sha256sum format: "<lowercase hex>  GeckoPeeks.exe". The app reads the first 64-hex token.
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = Join-Path (Split-Path -Parent $exe) "GeckoPeeks.exe.sha256"
          [System.IO.File]::WriteAllText($sidecar, "$hash  GeckoPeeks.exe`n", [System.Text.Encoding]::ASCII)
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "sidecar=$sidecar" >> $env:GITHUB_OUTPUT

      - name: Create release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SIDECAR: ${{ steps.hash.outputs.sidecar }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Published exe was not found at $exe"
          }
          if (-not (Test-Path -LiteralPath $env:SIDECAR)) {
            throw "SHA-256 file was not found at $env:SIDECAR"
          }

          # The app shows this body as plain text (first 4000 chars), so keep it simple.
          $version = $env:TAG.Substring(1)
          # HEAD is the commit being released (the tag on a tag push).
          $previous = git describe --tags --abbrev=0 --match "v*" "HEAD^" 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = $null }
          if ($previous) {
            $commits = git log --no-merges --pretty=format:"- %s" "$previous..HEAD"
          }
          else {
            $commits = git log --no-merges --pretty=format:"- %s" -n 30 HEAD
          }
          if ($LASTEXITCODE -ne 0 -or -not $commits) { $commits = @("- Maintenance release.") }

          $lines = @("Gecko Peeks $version", "")
          $lines += "What changed"
          if ($previous) { $lines += "(since $previous)" }
          $lines += $commits
          $lines += ""
          $lines += "How to update"
          $lines += "- Gecko Peeks downloads updates by itself. In 2.x, click Restart to update. In 1.0.x, right-click the gecko > Install update."
          $lines += "- First install: exit the old tray app (right-click the gecko > Exit), then run the new GeckoPeeks.exe."
          $lines += ""
          $lines += "GeckoPeeks.exe.sha256 holds the SHA-256 of GeckoPeeks.exe. The app checks the same SHA-256 before it installs."
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.txt"
          [System.IO.File]::WriteAllText($notesFile, ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding $false))
          "notes=$notesFile" >> $env:GITHUB_OUTPUT

          gh release view $env:TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe $env:SIDECAR --clobber
          }
          else {
            gh release create $env:TAG $exe $env:SIDECAR --title $env:TAG --notes-file $notesFile
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # The app does not read GitHub releases. It reads the stable channel on the gecko-peeks-api
      # Worker (Workers KV namespace gecko-peeks-releases). This step also needs the
      # GECKO_PUBLISH_KEY secret; without it the step fails and the channel is not changed.
      # Only a tag push promotes to stable. A manual dispatch builds whatever branch it was
      # started from, and every Production install would then install that by itself.
      - name: Publish to the stable update channel
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GECKO_PUBLISH_KEY: ${{ secrets.GECKO_PUBLISH_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GECKO_PUBLISH_KEY)) {
            throw "Secret GECKO_PUBLISH_KEY is not set, so the stable update channel was not updated."
          }
          $exe = Join-Path (Get-Location) "GeckoPeeks\bin\Release\net8.0-windows\win-x64\publish\GeckoPeeks.exe"
          $notes = [System.IO.File]::ReadAllText($env:NOTES_FILE)
          ./cloud/publish-release.ps1 -Exe $exe -Version $env:VERSION -Channel stable -Notes $notes -BaseUrl "https://gecko-peeks-api.gecko-apps.workers.dev"
